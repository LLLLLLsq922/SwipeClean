name: Validate

on:
  push:
  pull_request:

jobs:
  pure-logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Validate project metadata and pure logic
        shell: pwsh
        run: ./Tools/verify.ps1

